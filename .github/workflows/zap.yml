name: ZAP scans
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run: { shell: bash }
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Start the vulnerable target
        env: { APP_MODE: vuln }
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8080 >server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && break || sleep 1
          done
          curl -sf http://localhost:8080/api/health
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8080
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline
      - name: ZAP API scan (OpenAPI)
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8080/openapi.json
          format: openapi
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-api
      - name: Upload ZAP ⇄ findings mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-finding-mapping
          path: docs/zap-mapping.md
